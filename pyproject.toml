[project]
name = "vigil"
version = "0.1.0"
description = "Cost-aware, drift-aware fraud screening for online bank account opening."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Suelma Pina" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    # data
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "kagglehub>=0.3",     # BAF is distributed on Kaggle
    # modelling
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",         # per-decision reason codes
    # tracking, serving & demo
    "mlflow>=2.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "streamlit>=1.33",
    "altair>=5.3",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "ipykernel>=6.29",
    "httpx>=0.27",        # FastAPI TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
